[versions]
minSdkVersion = "24"
compileSdkVersion = "37"
targetSdkVersion = "34"

androidDesugarJdkLibs = "2.1.5"
androidGradlePlugin = "9.5.1"
gradleVersionsPlugin = "0.67.0"
kotlin = "2.4.21"
ksp = "2.3.13"
kover = "0.9.11"
dagger = "2.60.1"
kotlinxCoroutines = "1.11.0"
modulegraphPlugin = "0.15.0"

androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxFragment = "1.9.1"
androidxAppcompat = "1.8.0"
androidxLifecycle = "2.11.0"
androidxMaterial = "1.14.0"
androidxStartup = "1.2.0"
androidxExtJunit = "1.3.0"
androidxEspressoCore = "3.7.0"
androidxHilt = "1.4.0"
androidxPaging = "3.5.3"
androidxNavigation = "2.10.2"
androidxRoom = "2.8.5"
androidxDatastore = "1.3.0"
androidxWorkmanager = "2.12.0"

# BOM to library version mapping: https://developer.android.com/jetpack/compose/bom/bom-mapping
composeBom = "2026.09.00"

testJunit = "4.13.2"
testStrikt = "0.35.1"
testAndroidTestCore = "2.2.0"
testAndroidCore = "1.7.0"
testAndroidRunner = "1.7.0"
testMockk = "1.14.11"
testRobolectric = "4.17"

accompanist = "0.37.3"
moshi = "1.15.2"
okhttp = "5.5.1"
retrofit = "3.0.0"
timber = "5.0.1"
coil = "3.6.3"
flipper = "0.273.0"
soloader = "0.13.0"

konsist = "0.18.1"

[libraries]
android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidxMaterial" }
androidx-material-compose = { module = "androidx.compose.material:material" }
androidx-material3-compose = { module = "androidx.compose.material3:material3" }

androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidxNavigation" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidxStartup" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-paging = { module = "androidx.paging:paging-runtime", version.ref = "androidxPaging" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "androidxPaging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidxPaging" }
androidx-room-common = { module = "androidx.room:room-common", version.ref = "androidxRoom" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
androidx-room = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-datastore-prefs = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-workmanager = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWorkmanager" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-uigraphics = { module = "androidx.compose.ui:ui-graphics" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }

accompanist-drawablepainter = { module = "com.google.accompanist:accompanist-drawablepainter", version.ref = "accompanist" }

test-junit = { module = "junit:junit", version.ref = "testJunit" }
test-strikt = { module = "io.strikt:strikt-core", version.ref = "testStrikt" }
test-android_core = { module = "androidx.arch.core:core-testing", version.ref = "testAndroidTestCore" }
test-android_test_core = { module = "androidx.test:core", version.ref = "testAndroidCore" }
test-mockk = { module = "io.mockk:mockk", version.ref = "testMockk" }
test-mockk-agent-jvm = { module = "io.mockk:mockk-agent-jvm", version.ref = "testMockk" }
test-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
test-coroutine_test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
test-robolectric = { module = "org.robolectric:robolectric", version.ref = "testRobolectric" }
test-paging = { module = "androidx.paging:paging-testing", version.ref = "androidxPaging" }
test-konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }

androidTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxExtJunit" }
androidTestRunner = { module = "androidx.test:runner", version.ref = "testAndroidRunner" }
androidTestEspressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxEspressoCore" }

moshi = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp_logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "dagger" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "dagger" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
flipper = { module = "com.facebook.flipper:flipper", version.ref = "flipper" }
flipper-network = { module = "com.facebook.flipper:flipper-network-plugin", version.ref = "flipper" }
soloader = { module = "com.facebook.soloader:soloader", version.ref = "soloader" }

# Dependencies of the included build-logic
android-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
compose-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-kover = { group = "org.jetbrains.kotlinx.kover", name = "org.jetbrains.kotlinx.kover.gradle.plugin", version.ref = "kover" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
gradle-versions-plugin = { id = "io.github.ben-manes.versions", version.ref = "gradleVersionsPlugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
module-graph = { id = "dev.iurysouza.modulegraph", version.ref = "modulegraphPlugin" }

# Plugins defined by this project
moviedatabase-android-application = { id = "moviedatabase.android.application", version = "unspecified" }
moviedatabase-android-application-compose = { id = "moviedatabase.android.application.compose", version = "unspecified" }
moviedatabase-android-library = { id = "moviedatabase.android.library", version = "unspecified" }
moviedatabase-android-library-compose = { id = "moviedatabase.android.library.compose", version = "unspecified" }
moviedatabase-jvm-library = { id = "moviedatabase.jvm.library", version = "unspecified" }
moviedatabase-jvm-external = { id = "moviedatabase.jvm.external", version = "unspecified" }
