name: Android CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
    - name: Build, test, lint, and collect coverage
      run: ./gradlew --stacktrace :app:assembleDebug :app:assembleRelease :app:lintDebug koverXmlReportMerged :core:data:testDebugUnitTest
    - name: Codecov
      uses: codecov/codecov-action@v5
      with:
        flags: unittests
        disable_search: true
        files: ./build/reports/kover/reportMerged.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
